<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>福瑞斯特中小學－AI校隊</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="container py-3">

    <!-- Header -->

    <div class="header">

        <img
            src="logo.png"
            class="school-logo"
            alt="福瑞斯特中小學 Logo">

        <h1 class="main-title">

            福瑞斯特中小學－AI校隊

        </h1>

        <div class="sub-title">

            AI 校隊活動確認系統

        </div>

    </div>

    <!-- Activity -->

    <div id="activityPage">

        <h2 class="page-title">

            請選擇活動

        </h2>

        <div
            id="activityList"
            class="row g-4">

        </div>

    </div>

    <!-- Student -->

    <div
        id="studentPage"
        style="display:none;">

        <button
            class="btn btn-start mb-4"
            onclick="backActivity()">

            <i class="fa-solid fa-arrow-left"></i>

            返回活動

        </button>

        <h3
            id="activityTitle"
            class="mb-4">

        </h3>

        <input

            id="searchInput"

            type="search"

            autocomplete="off"

            class="form-control mb-4"

            placeholder="搜尋班級、座號或姓名">

        <div

            id="studentList"

            class="row g-4">

        </div>

    </div>

</div>

<!-- ===========================
     Activity Card
============================ -->

<template id="activityTemplate">

<div class="col-lg-6">

    <div class="activity-card">

        <div class="activity-date">

        </div>

        <div class="activity-name">

        </div>

        <div class="activity-progress">

            已回覆：

            <span class="progress-text">

                0 / 0

            </span>

        </div>

        <button class="btn btn-start">

            開始填寫

        </button>

    </div>

</div>

</template>
<!-- ===========================
     Student Card
============================ -->

<template id="studentTemplate">

    <div class="col-xl-3 col-lg-4 col-md-6 col-12">

        <div class="student-card">

            <div class="status-dot"></div>

            <div class="student-id">

            </div>

            <div class="student-name">

            </div>

            <hr class="my-3">

            <div class="student-status">

                ● 尚未確認

            </div>

        </div>

    </div>

</template>

<!-- ===========================
     Bootstrap
============================ -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ===========================
     JavaScript
============================ -->

<script src="script.js"></script>

</body>

</html>
